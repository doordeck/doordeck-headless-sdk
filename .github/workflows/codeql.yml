name: "CodeQL (Advanced Security)"

# Weekly only (Mondays 02:00 UTC), plus manual runs. Deliberately kept off PRs
# and pushes to main, as the analysis is too slow to gate PRs on.
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # Interpreted / no-build languages — scanned directly from source.
  analyze:
    name: "Analyze (${{ matrix.language }})"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, csharp ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: +security-extended
          config: |
            paths-ignore:
              - samples

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  analyze-kotlin:
    name: "Analyze (java-kotlin)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: +security-extended

      # The compile process must actually run under the CodeQL tracer: bypass the build
      # cache (enabled in gradle.properties), the Gradle daemon and the Kotlin
      # daemon.
      - name: Build (JVM + Android)
        run: >
          ./gradlew :doordeck-sdk:compileKotlinJvm :doordeck-sdk:compileAndroidMain
          --no-daemon --no-build-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
